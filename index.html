<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10140f">
<title>TRU CODE</title>
<style>
:root{--bg:#10140f;--ink:#e7f0dc;--dim:#a8b89a;--line:#2c3824;--leaf:#c6d86a;--card:#1a2216;--bad:#c4543a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
button,input{font:inherit;color:inherit}
header{padding:16px 16px 6px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--leaf)}
.sub{color:var(--dim);font-size:13px}
.warn{margin:10px 16px;padding:10px 12px;border:1px solid var(--bad);border-radius:10px;font-size:14px}
.bar{display:flex;gap:8px;padding:8px 16px} input{flex:1;background:#0c100a;border:1px solid var(--line);border-radius:8px;padding:10px}
button{background:var(--leaf);color:#14180f;border:0;border-radius:8px;padding:10px 12px;font-weight:bold}
main{padding:0 16px 28px} .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--leaf);font-size:12px;letter-spacing:.12em} .big{font-size:22px;margin:4px 0} .src{color:var(--dim);font-size:12px;margin-top:6px}
pre{white-space:pre-wrap;font:13px/1.4 ui-monospace,monospace;color:var(--ink);margin:8px 0 0}
</style>
</head>
<body>
<header><h1>TRU <span>CODE</span></h1><p class="sub">One file. Words, look, steps. A gap when you do not know. Not a language manual.</p></header>
<div class="warn">Save the file. Open it in a browser. If it needs a network to run, it is not a lane. This page is the example. It does not call out.</div>
<div class="bar"><input id="q" placeholder="file, if, list…" enterkeyhint="search"><button id="send">Send</button></div>
<main id="out"></main>
<script>
const C=[
{t:"One file",d:"A lane is one HTML file. The browser reads it from the top. No install. No account. Save it to the phone and the radio can be off."},
{t:"Three parts",d:"HTML holds the words and the boxes. CSS, in the style tag, holds the look. Script holds the steps. Keep them in that order: head, then body, then the steps that fill the body."},
{t:"A name",d:"A name holds a value. const lane = \"Code\" means the name lane holds the word Code. You do not retype the word. You use the name."},
{t:"If",d:"If chooses. If the search box is empty, show every card. If it is not, show the cards whose text contains the search. The other path is the gap card. There is no third path you did not write."},
{t:"A list",d:"A list is walked. The cards on this page are an array. map walks it and builds one block each. filter walks it and keeps the ones that match. Join puts the blocks into one string the page can show."},
{t:"A gap",d:"If you do not know the step, write the gap. Do not invent a function you cannot run. The other lanes do this with facts. This lane does it with code. A comment that says later is not a step."},
{t:"The smallest lane",d:"A title. A list of cards. A search that filters the list. A line that says not packed when nothing matches. That is the shape of Shelter, Ford, Cold, and this page. Copy the shape. Change the words. Do not add a server."}
];
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&","<":"<",">":">"}[c]));}
function card(x){return `<article class="card"><div class="k">CODE</div><div class="big">${esc(x.t)}</div><div>${esc(x.d)}</div><div class="src">The file you are reading. No framework. No network.</div></article>`;}
function show(l){document.getElementById("out").innerHTML=l.map(card).join("");}
function search(q){q=(q||"").trim().toLowerCase(); if(!q){show(C);return;} const h=C.filter(x=>(x.t+" "+x.d).toLowerCase().includes(q)); document.getElementById("out").innerHTML=h.length?h.map(card).join(""):`<article class="card"><div class="k">GAP</div><div class="big">Not packed</div><div>No invented step.</div></article>`;}
document.getElementById("send").onclick=()=>search(document.getElementById("q").value);
document.getElementById("q").onkeydown=e=>{if(e.key==="Enter") search(e.target.value);};
show(C);
</script>
</body>
</html>
